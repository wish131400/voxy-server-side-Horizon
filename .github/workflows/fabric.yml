name: Fabric version contracts

on:
  workflow_dispatch:
  push:
    paths:
      - src/**
      - gradle/**
      - '*.gradle'
      - gradle.properties
      - tools/verification/**
      - tools/prediction/compat-tests.gradle
      - .github/workflows/fabric.yml
  pull_request:

permissions:
  contents: read

jobs:
  community-voxy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant:
          - mihile-1.20.1
          - m3-1.20.1
          - m3-1.21.1
          - tkettela-1.20.1
          - wu-bao-1.21.1
          - water-fix-1.21.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: endsWith(matrix.variant, '-1.20.1')
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Expose both legacy Java runtimes
        if: endsWith(matrix.variant, '-1.20.1')
        run: |
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          printf '%s\n' 'org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME' >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - name: Verify evidence runner regressions
        run: python -m unittest discover -s tools/verification -p test_community_matrix.py
      - name: Prepare pinned community binaries and source builds
        run: >-
          python tools/verification/fetch_community_voxy.py
          --variant '${{ matrix.variant }}'
          --gradle-user-home external/community-build-cache
      - name: Apply production hooks to the actual community dependency
        run: >-
          python tools/verification/community_matrix.py
          --variant '${{ matrix.variant }}' --stage contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-${{ matrix.variant }}
          path: |
            external/community-compat/*/validation/
            external/community-compat/*/provenance.json

  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            java: '21'
            package_task: remapJar
          - minecraft: '1.21.1'
            java: '21'
            package_task: remapJar
          - minecraft: '1.21.11'
            java: '21'
            package_task: remapJar
          - minecraft: '26.1'
            java: '25'
            package_task: jar
          - minecraft: '26.1.1'
            java: '25'
            package_task: jar
          - minecraft: '26.1.2'
            java: '25'
            package_task: jar
          - minecraft: '26.2'
            java: '25'
            package_task: jar
          - minecraft: '26.3'
            java: '25'
            package_task: jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.minecraft == '1.20.1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Expose both Java runtimes to Gradle toolchains
        if: matrix.minecraft == '1.20.1'
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          test -x "$JAVA_HOME/bin/java"
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          printf '%s\n' 'org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME' >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      - name: Download pinned bytecode contract inputs
        id: mods
        run: python tools/verification/fetch_compat_mods.py --minecraft '${{ matrix.minecraft }}' --github-output
      - name: Compile, run regressions and package the production mod
        env:
          VOXY_JAR: ${{ steps.mods.outputs.voxy_jar }}
          IRIS_JAR: ${{ steps.mods.outputs.iris_jar }}
        run: >-
          bash gradlew verifyModules fabricMigrationTest fabricContractTest
          ${{ matrix.package_task }} --continue --console=plain
          '-PmcTarget=${{ matrix.minecraft }}' '-PvssBuildId=ci-${{ github.sha }}'
          "-PvssVoxyJar=$VOXY_JAR" "-PvssIrisJar=$IRIS_JAR"
      - name: Verify optional dependency evidence runner
        run: |
          python -m unittest discover -s tools/verification -p test_optional_matrix.py
          python -m unittest discover -s tools/verification -p test_remap_worldgen_test_jar.py
      - name: Apply optional adapters to pinned actual Fabric releases
        run: python tools/verification/optional_matrix.py --minecraft '${{ matrix.minecraft }}'
      - name: Start server, generate a real column and save its cache
        run: python tools/verification/server_smoke.py --minecraft '${{ matrix.minecraft }}'
      - name: Verify packaged metadata and source snapshot
        run: >-
          python tools/verification/verify_release.py
          'lib/vss-0.3.6-fabric-${{ matrix.minecraft }}.jar'
          --platform fabric --source . --minecraft '${{ matrix.minecraft }}'
          --build-id 'ci-${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fabric-${{ matrix.minecraft }}
          path: |
            lib/*.jar
            build/**/test-results/**/TEST-*.xml
            build/**/server-smoke.json
            build/**/server-smoke.log
            external/optional-compat/*/validation/
            external/optional-compat/*/inputs.json
