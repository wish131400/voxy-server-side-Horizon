ext.minecraftTargets = [
    '1.21.11': [java: 21, api: '0.141.6+1.21.11', apiMin: '0.139.4+1.21.11', menu: '17.0.0', overlays: []],
    '26.1':    [java: 25, api: '0.145.1+26.1', apiMin: '0.144.0+26.1', loaderMin: '0.18.4', menu: '18.0.2', overlays: ['mc26']],
    '26.1.1':  [java: 25, api: '0.145.4+26.1.1', apiMin: '0.145.4+26.1.1', loaderMin: '0.18.4', menu: '18.0.2', overlays: ['mc26']],
    '26.1.2':  [java: 25, api: '0.155.3+26.1.2', apiMin: '0.145.4+26.1.2', loaderMin: '0.18.4', menu: '18.0.2', overlays: ['mc26']],
    '26.2':    [java: 25, api: '0.161.0+26.2', apiMin: '0.152.1+26.2', loaderMin: '0.18.4', menu: '20.0.3', overlays: ['mc26', 'mc262']],
    '26.3':    [java: 25, api: '0.165.0+26.3', apiMin: '0.160.5+26.3', loaderMin: '0.19.3', menu: '21.0.0', overlays: ['mc26', 'mc262', 'mc263']],
    '1.21.1':  [java: 21, api: '0.116.17+1.21.1', apiMin: '0.116.7+1.21.1', menu: '11.0.3', overlays: ['mc121']],
    '1.20.1':  [java: 17, api: '0.92.12+1.20.1', apiMin: '0.92.6+1.20.1', menu: '7.2.2', overlays: ['mc120']]
]
ext.selectedMinecraft = providers.gradleProperty('mcTarget').getOrElse('1.21.11')
if (!minecraftTargets.containsKey(selectedMinecraft)) {
    throw new GradleException('Unsupported Minecraft target: ' + selectedMinecraft)
}
ext.selectedTarget = minecraftTargets[selectedMinecraft]
// Build pins are independent of the oldest supported runtime. The baseline
// switch compiles against those real releases so widening metadata is checked.
ext.fabricLoaderMinimum = selectedTarget.getOrDefault('loaderMin', loader_min_version)
ext.fabricApiMinimum = selectedTarget.apiMin
def dependencyBaseline = providers.gradleProperty('fabricCompatibilityBaseline').map { it.toBoolean() }.getOrElse(false)
// Newer Mixin changes @Redirect.at from one annotation to an array. Compile
// against the supported Loader baseline so older MixinExtras can read it.
ext.fabricCompileLoader = selectedTarget.getOrDefault('loaderMin', loader_version)
ext.fabricCompileApi = dependencyBaseline ? fabricApiMinimum : selectedTarget.api
// Vanilla section headers, palettes, registry IDs and worldgen codecs are
// versioned together. Never reuse a column body across Minecraft upgrades.
def targetIndex = minecraftTargets.keySet().toList().indexOf(selectedMinecraft)
ext.selectedTarget.protocol = 54 + targetIndex
ext.selectedTarget.columnSchema = 6 + targetIndex
