allprojects {
    // Fabric Loader normally exposes a mod's nested libraries. Offline JUnit
    // loads TerraBlender through its own URLClassLoader, so supply those exact
    // bundled libraries on the worker parent classpath. The mod itself stays
    // behind the optional test hook and cannot alter unrelated test fixtures.
    def terraBlenderJar = providers.gradleProperty('vssTerraBlenderJar')
    if (terraBlenderJar.isPresent()) {
        def nestedDirectory = layout.buildDirectory.dir('worldgen-test-dependencies/terrablender')
        def extractNested = tasks.register('extractTerraBlenderTestDependencies', Sync) {
            inputs.file(providers.provider { file(terraBlenderJar.get()) })
                    .withPropertyName('terraBlenderJar')
            from({ zipTree(file(terraBlenderJar.get())) }) {
                include 'META-INF/jars/*.jar'
            }
            into nestedDirectory
        }
        def nestedClasspath = files({
            fileTree(nestedDirectory.get().asFile) { include '**/*.jar' }
        }).builtBy(extractNested)
        // Custom Test tasks also use sourceSets.test.runtimeClasspath; add the
        // extracted files through the runtime configuration so they see them.
        dependencies.add('testRuntimeOnly', nestedClasspath)
    }
    tasks.withType(Test).configureEach {
        if (providers.gradleProperty('vssSodiumJar').isPresent()) {
            systemProperty 'vss.sodiumJar', providers.gradleProperty('vssSodiumJar').get()
        }
        if (providers.gradleProperty('vssIrisJar').isPresent()) {
            systemProperty 'vss.irisJar', providers.gradleProperty('vssIrisJar').get()
        }
        if (providers.gradleProperty('vssFabricBiomeJar').isPresent()) {
            systemProperty 'vss.fabricBiomeJar', providers.gradleProperty('vssFabricBiomeJar').get()
        }
        if (providers.gradleProperty('vssMostructuresJar').isPresent()) {
            systemProperty 'vss.mostructuresJar', providers.gradleProperty('vssMostructuresJar').get()
        }
        if (providers.gradleProperty('vssNbtTreeJar').isPresent()) {
            systemProperty 'vss.nbtTreeJar', providers.gradleProperty('vssNbtTreeJar').get()
        }
        if (providers.gradleProperty('vssTemplateCatalogDirectory').isPresent()) {
            systemProperty 'vss.templateCatalogDirectory', providers.gradleProperty('vssTemplateCatalogDirectory').get()
        }
        if (providers.gradleProperty('vssLiveSnapshot').isPresent()) {
            systemProperty 'vss.liveSnapshot', providers.gradleProperty('vssLiveSnapshot').get()
        }
        if (providers.gradleProperty('vssTestNativeLibrary').isPresent()) {
            systemProperty 'vss.testNativeLibrary', providers.gradleProperty('vssTestNativeLibrary').get()
        }
        if (providers.gradleProperty('vssC2meDfcJar').isPresent()) {
            systemProperty 'vss.c2meDfcJar', providers.gradleProperty('vssC2meDfcJar').get()
        }
        if (providers.gradleProperty('vssEpicTerrainJars').isPresent()) {
            systemProperty 'vss.epicTerrainJars', providers.gradleProperty('vssEpicTerrainJars').get()
        }
        if (providers.gradleProperty('vssFreeTerraForgedJar').isPresent()) {
            systemProperty 'vss.freeTerraForgedJar', providers.gradleProperty('vssFreeTerraForgedJar').get()
        }
        if (providers.gradleProperty('vssLithostitchedJar').isPresent()) {
            systemProperty 'vss.lithostitchedJar', providers.gradleProperty('vssLithostitchedJar').get()
        }
        if (providers.gradleProperty('vssTectonicJar').isPresent()) {
            systemProperty 'vss.tectonicJar', providers.gradleProperty('vssTectonicJar').get()
        }
        if (providers.gradleProperty('vssTerraBlenderJar').isPresent()) {
            systemProperty 'vss.terrablenderJar', providers.gradleProperty('vssTerraBlenderJar').get()
        }
        if (providers.gradleProperty('vssBetterEndJar').isPresent()) {
            systemProperty 'vss.betterendJar', providers.gradleProperty('vssBetterEndJar').get()
        }
        if (providers.gradleProperty('vssVoxyJar').isPresent()) {
            systemProperty 'vss.voxyJar', providers.gradleProperty('vssVoxyJar').get()
        }
        if (providers.gradleProperty('vssLegacyVoxyJar').isPresent()) {
            systemProperty 'vss.legacyVoxyJar', providers.gradleProperty('vssLegacyVoxyJar').get()
        }
        if (providers.gradleProperty('vssLostCitiesMatrix').isPresent()) {
            systemProperty 'vss.lostCitiesMatrix', providers.gradleProperty('vssLostCitiesMatrix').get()
        }
        if (providers.gradleProperty('vssLostCitiesJar').isPresent()) {
            systemProperty 'vss.lostCitiesJar', providers.gradleProperty('vssLostCitiesJar').get()
        }
        if (providers.gradleProperty('vssXaeroJars').isPresent()) {
