allprojects { afterEvaluate {
    tasks.register('schedulingConcurrencyTest', Test) {
        dependsOn tasks.named('testClasses')
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        ['PredictionSchedulingConcurrencyTest', 'PredictionNearFirstSchedulingTest',
         'PredictionTeleportSchedulingTest', 'PredictionBackgroundSchedulingTest',
         'PredictionSchedulingFactsTest', 'PredictionCoarsePlanHandoffTest',
         'PredictionSurfacePipelineTest', 'PredictionSurfaceDemandTest',
         'PredictionCacheRecoveryConcurrencyTest', 'PredictionCacheWorkerLifecycleTest',
         'PredictionSurfaceRetryTest'].each { include "**/${it}.class" }
        jvmArgs '-XX:ActiveProcessorCount=8'
        maxHeapSize = '2G'; maxParallelForks = 1; forkEvery = 1
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
    }
} }
