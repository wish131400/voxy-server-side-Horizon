// Each actual Mixin application needs its own Sponge global state.
// Optional mods are checked in isolation: none becomes a production dependency.
tasks.register('optionalCompatTest', Test) {
    group = 'verification'
    description = 'Checks optional Fabric mod adapters and pinned release bytecode.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    ['CuriosCompatTest', 'FabricEquipmentCompatTest', 'FabricEquipmentActualJarTest',
     'XaeroActualJarContractTest', 'XaeroMapCompatStubContractTest',
     'XaeroMapCompatRegionLoadingTest', 'XaeroMapCompatQueueTest',
     'XaeroMapCompatBufferUpdateTest', 'XaeroTileExtractorTest',
     'DensityMemoCompatTest', 'C2meDensityMemoCompatTest',
     'BandwidthOptimizerCompatTest', 'OptionalWorldgenMixinApplicationTest',
     'ByePregenMixinApplicationTest', 'CreateReleaseContractTest',
     'FreeTerraForgedMixinApplicationTest', 'NbtTreePredictionTemplatesTest',
     'FreeTerraForgedCompatTest', 'LostCityReleaseMatrixTest',
     'TectonicPresetSnapshotTest', 'DensityFunctionSnapshotTest', 'AppliedDensityRecordsTest',
     'ForceLoadQueueTest', 'FtbActualJarContractTest',
     'FtbMinecraftMixinApplicationTest', 'FtbForceLoadIntegrationTest',
     'FtbPlatformMixinApplicationTest'].each { include "**/${it}.class" }
    maxHeapSize = '3G'
    maxParallelForks = 1
    forkEvery = 1
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}

tasks.register('fabricContractTest', Test) {
    group = 'verification'
    description = 'Applies Minecraft, Voxy and Iris hooks to real dependency bytecode.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    ['FabricMinecraftMixinApplicationTest', 'FabricIrisMixinApplicationTest',
     'VoxyPredictionCapabilitiesTest', 'VoxyNativeFaceContractTest',
     'VoxyPredictionMixinApplicationTest', 'VoxyIngestMixinApplicationTest',
     'VoxyIngestBytecodeTest', 'VoxyIngestContractTest',
     'VoxyRenderPipelineMixinApplicationTest', 'VoxyNeighborVariantMixinTest',
     'VoxyFluidBakeCompatibilityTest', 'PredictionNormalDepthBridgeTest',
     'PredictionAtlasTest', 'VoxyDelegatedIngestTest',
     'VoxyServerLodMixinApplicationTest', 'VoxyServerLodServerCompatTest',
     'VoxyServerLodClientCompatTest', 'VoxyNativeIngestAuthorityTest'].each { include "**/${it}.class" }
    maxHeapSize = '2G'
    maxParallelForks = 1
    forkEvery = 1
    doFirst {
        if (!providers.gradleProperty('vssVoxyJar').isPresent()) {
            throw new GradleException('Supply -PvssVoxyJar with the actual Voxy release JAR')
        }
    }
}

tasks.register('fabricMigrationTest', Test) {
    group = 'verification'
    description = 'Checks migrated world generation, native ABI, palettes and payload limits.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    ['TerrainGeneratorSnapshotTest', 'WorldgenDimensionTypeSnapshotTest',
     'RegionPresenceTransferTest', 'VssNativePlatformTest',
     'PredictionEndDecorationTest', 'PredictionEndColumnsTest',
     'PredictionVegetationHandoffTest', 'PredictionVegetationPublicationTest',
     'RustBiomeIdentityTest', 'RustDimensionBoundsTest',
     'RustVegetationStageTest', 'RustVegetationDeltaUploadTest'].each { include "**/${it}.class" }
    ['PredictionClimateSamplerTest', 'PredictionJavaExteriorTest', 'ClientWorldgenRegistriesTest',
     'ClientWorldgenStaticRegistriesTest', 'PredictionRegistryContextCacheTest',
     'PredictionPlacementExecutorTest', 'PredictionVegetationTest',
     'PredictionNetherDecorationTest', 'PredictionNativeNetherFeatureTest',
     'RustVegetationDescriptorsTest'].each { include "**/${it}.class" }
    ['FabricBiomeCompatTest', 'WorldgenRegistryDependenciesTest', 'WorldgenRegistryTagsTest',
     'PredictionWorldgenCapabilitiesTest', 'PredictionLodBackendsTest', 'PredictionBackendSelectionTest',
     'TerraBlenderRequiredRoutingTest', 'TerraBlenderEndRoutingTest', 'TerraBlenderEndSnapshotTest', 'TerraBlenderEndBiomeSourceTest',
     'BetterEndCompatTest'].each { include "**/${it}.class" }
    if (minecraft_version == '26.3') {
        ['FloatDensityCompilerTest', 'FloatMaterialPipelineTest'].each { include "**/${it}.class" }
    }
    maxHeapSize = '3G'
    maxParallelForks = 1
    forkEvery = 1
    doFirst {
        // Use the biome API selected by Loom for this exact Minecraft target.
        if (!providers.gradleProperty('vssFabricBiomeJar').isPresent()) {
            def biomeApi = classpath.files.find { it.name.contains('fabric-biome-api-v1') && it.name.endsWith('.jar') }
            if (biomeApi == null) throw new GradleException('Selected Fabric biome API is missing from the runtime classpath')
            systemProperty 'vss.fabricBiomeJar', biomeApi.absolutePath
        }
    }
}

// Explicit GPU invocation keeps headless CI separate from real driver verification.
tasks.register('fabricGpuContractTest', Test) {
    group = 'verification'
    description = 'Renders the real Voxy shader fixtures and validates final depth transfer on the GPU.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    ['StrictVoxyShaderFixtureGpuTest', 'PredictionNormalDepthBridgeGpuTest',
     'VoxyTraversalCapacityMixinTest', 'VoxyTraversalQueueGpuTest',
     'VoxySurfaceHeightsTest'].each { include "**/${it}.class" }
    systemProperty 'vss.gpuTests', 'true'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxHeapSize = '2G'
    maxParallelForks = 1
    forkEvery = 1
    doFirst {
        if (!providers.gradleProperty('vssVoxyJar').isPresent()) {
            throw new GradleException('Supply -PvssVoxyJar with the actual Voxy release JAR')
        }
    }
}
