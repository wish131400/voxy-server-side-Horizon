import java.time.Duration

// Development-only client verification. These sources and dependencies are not
// part of main/test or any published VSS artifact.
def smokeSources = sourceSets.create('clientSmoke') {
    java.srcDir 'tools/verification/client-smoke/java'
    resources.srcDir 'tools/verification/client-smoke/resources'
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

def needsRuntimeRemap = minecraft_version.startsWith('1.')
def smokeRuntimeConfiguration = smokeSources.runtimeOnlyConfigurationName
if (needsRuntimeRemap) {
    // Published 1.x Fabric mods contain intermediary Minecraft references;
    // a raw runtimeOnly file would fail against this named development runtime.
    smokeRuntimeConfiguration = 'modClientSmokeRuntimeOnly'
    loom.addRemapConfiguration(smokeRuntimeConfiguration) {
        sourceSet = smokeSources
        targetConfigurationName = smokeSources.runtimeOnlyConfigurationName
        onCompileClasspath = false
        onRuntimeClasspath = true
        applyDependencyTransforms = true
    }
}
// Minecraft 26.x and its matching Fabric mods already use unobfuscated names.
// Keep their original JARs on the isolated smoke runtime classpath.
def externalMods = [vssVoxyJar: 'voxy', vssSodiumJar: 'sodium', vssIrisJar: 'iris']
externalMods.each { propertyName, modId ->
    if (providers.gradleProperty(propertyName).isPresent()) {
        dependencies.add(smokeRuntimeConfiguration,
                files(providers.gradleProperty(propertyName).map { file(it) }))
    }
}

// Loom's development classpath does not load a mod's jar-in-jar libraries.
// Follow each supplied release's own metadata, including transitive nesting,
// so the probe uses the same dependency contents as a normal Fabric launch.
def nestedSmokeLibraries = providers.provider {
    def libraries = new LinkedHashSet<File>()
    def visited = new HashSet<String>()
    def cache = layout.buildDirectory.dir('client-smoke-libraries').get().asFile
    def collectLibraries
    collectLibraries = { File input, String expectedId ->
        new java.util.zip.ZipFile(input).withCloseable { archive ->
            def metadataEntry = archive.getEntry('fabric.mod.json')
            if (metadataEntry == null) {
                if (expectedId != null) throw new GradleException('Not a Fabric mod JAR: ' + input)
                return
            }
            def metadata = archive.getInputStream(metadataEntry).withCloseable { stream ->
                new groovy.json.JsonSlurper().parse(stream)
            }
            if (expectedId != null && metadata.id != expectedId) {
                throw new GradleException('Expected mod ' + expectedId + ', found ' + metadata.id + ': ' + input)
            }
            (metadata.jars ?: []).each { nested ->
                def entry = archive.getEntry(nested.file as String)
                if (entry == null || entry.directory || !entry.name.endsWith('.jar')) {
                    throw new GradleException('Invalid nested JAR ' + nested.file + ': ' + input)
                }
                def bytes = archive.getInputStream(entry).withCloseable { it.readAllBytes() }
                def crc = new java.util.zip.CRC32()
                crc.update(bytes)
                if (bytes.length != entry.size || crc.value != entry.crc) {
                    throw new GradleException('Corrupt nested JAR ' + entry.name + ': ' + input)
                }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                def hash = java.util.HexFormat.of().formatHex(digest.digest(bytes))
                if (!visited.add(hash)) return
                // Content-derived paths avoid release-name collisions and never
                // turn an archive entry name into a filesystem destination.
                def extracted = new File(cache, hash + '.jar')
                cache.mkdirs()
                if (!extracted.isFile() || !java.util.Arrays.equals(extracted.bytes, bytes)) {
                    extracted.bytes = bytes
                }
                collectLibraries(extracted, null)
                libraries.add(extracted)
            }
        }
    }
    externalMods.each { propertyName, modId ->
        if (providers.gradleProperty(propertyName).isPresent()) {
            collectLibraries(file(providers.gradleProperty(propertyName).get()), modId)
        }
    }
    libraries
}
dependencies.add(smokeRuntimeConfiguration, files(nestedSmokeLibraries))

def smokeReport = providers.gradleProperty('vssSmokeReport')
        .map { file(it) }.orElse(layout.buildDirectory.file('client-smoke.json').map { it.asFile })
def requiredMods = ['vss', 'voxy', 'sodium', 'fabric-api']
if (providers.gradleProperty('vssIrisJar').isPresent()) requiredMods.add('iris')

loom {
    mods {
        vss { sourceSet sourceSets.main }
        vss_smoke { sourceSet smokeSources }
    }
    runs {
        clientSmoke {
            client()
            source smokeSources
            runDir providers.gradleProperty('vssSmokeRunDir')
                    .getOrElse('run/client-smoke-' + minecraft_version)
            vmArg '-Dvss.smoke.report=' + smokeReport.get().absolutePath
            vmArg '-Dvss.smoke.requiredMods=' + requiredMods.join(',')
            ideConfigGenerated false
        }
    }
}

tasks.named('runClientSmoke').configure {
    group = 'verification'
    description = 'Starts the real Fabric client with Voxy/Sodium and verifies the initialized title screen.'
    dependsOn tasks.named(smokeSources.classesTaskName)
    timeout = Duration.ofSeconds(180)
    doFirst {
        ['vssVoxyJar', 'vssSodiumJar'].each { propertyName ->
            if (!providers.gradleProperty(propertyName).isPresent()) {
                throw new GradleException('Client smoke requires -P' + propertyName + '=<matching release JAR>')
            }
        }
        // Release identity and nested entries are validated during resolution.
        delete smokeReport.get()
    }
    doLast {
        def reportFile = smokeReport.get()
        if (!reportFile.isFile()) {
            throw new GradleException('Client exited without a smoke report: ' + reportFile)
        }
        def report = new groovy.json.JsonSlurper().parse(reportFile)
        if (report.status != 'passed') {
            throw new GradleException('Client smoke failed: ' + report.reason + '; report: ' + reportFile)
        }
        logger.lifecycle('Client initialization smoke passed; report: ' + reportFile)
    }
}
