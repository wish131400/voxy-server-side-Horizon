pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'voxy-server-side-horizon'
def minecraftTarget = providers.gradleProperty('mcTarget').getOrElse('1.21.11')
if (minecraftTarget in ['1.20.1', '1.21.1']) {
    rootProject.buildFileName = 'fabric-legacy.gradle'
} else if (minecraftTarget != '1.21.11') {
    rootProject.buildFileName = 'fabric-next.gradle'
}
